name: TestFlight

on:
  push:
    tags: ["v*"]
    # A tag is the normal way in, and the only one worth using once these
    # workflows reach the default branch. Until they do, GitHub offers no
    # other route: workflow_dispatch is registered from the default branch
    # only, and this account's push credentials are scoped to
    # refs/heads/claude/*, so a v-tag cannot be pushed either. The job below
    # is gated on the commit message, so an ordinary push to the branch
    # builds nothing and uploads nothing.
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What testers should look at in this build"
        required: false
        default: "Internal build"

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  SCHEME: PeriodicPro
  PROJECT: PeriodicPro.xcodeproj
  # App Store Connect only accepts builds made with Xcode 26 or newer.
  XCODE_VERSION: "26.0"
  ARCHIVE_PATH: build/PeriodicPro.xcarchive
  EXPORT_PATH: build/export

jobs:
  deploy:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    # Uploading a build is not something to do by accident: it consumes a
    # build number, and a build that reaches App Store Connect cannot be
    # unsent. A tag or a manual run says so by itself; a branch push has to
    # say so in the commit message.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[testflight]')
    steps:
      # ---------------------------------------------------------------- setup
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner. \
          App Store Connect rejects builds from older toolchains."
            ls /Applications | grep -i '^Xcode' || true
            exit 1
          fi
          xcodebuild -version

      - name: Ensure xcbeautify is available
        run: which xcbeautify || brew install xcbeautify

      - name: Resolve simulators
        run: |
          set -euo pipefail
          # GitHub rotates the device set in its macOS images, so the
          # destinations are resolved from what the machine actually has rather
          # than hard-coded by name.
          xcrun simctl list devices available --json \
            | python3 Tools/pick_simulators.py >> "$GITHUB_ENV"

      # Presence only. A secret's value is never echoed, never written to a
      # file the artifact step can reach, and never interpolated into a message
      # — the most this step will ever say about one is "configured".
      - name: Check required configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID \
                      APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "$name: MISSING"
              echo "::error::Missing required secret: $name (see TESTFLIGHT.md)"
              missing=1
            else
              echo "$name: configured"
            fi
          done

          # The bundle identifier is not a secret — it ships inside the app and
          # is visible to anyone who downloads it — so checking its value is
          # both safe and necessary. The repository variable overrides the
          # committed one, which makes a typo there silently fatal: signing
          # fails for an identifier this account does not own.
          COMMITTED=$(sed -n 's/^PRODUCT_BUNDLE_IDENTIFIER_BASE = //p' \
            Config/Shared.xcconfig | tr -d '[:space:]')
          echo "Config/Shared.xcconfig bundle identifier: $COMMITTED"
          if [ -z "${BUNDLE_ID:-}" ]; then
            echo "BUNDLE_IDENTIFIER variable: not set (using the committed value)"
          elif [ "$BUNDLE_ID" != "$COMMITTED" ]; then
            echo "BUNDLE_IDENTIFIER variable: $BUNDLE_ID"
            echo "::error::The BUNDLE_IDENTIFIER repository variable and \
          Config/Shared.xcconfig disagree. The variable wins, so the archive would be \
          signed for $BUNDLE_ID. Make them match before uploading."
            missing=1
          else
            echo "BUNDLE_IDENTIFIER variable: $BUNDLE_ID (matches)"
          fi
          [ "$missing" -eq 0 ]

      # ------------------------------------------------------- authentication
      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool and xcodebuild both look for the key in this directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s' "$PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Accept the key with or without the PEM armour, and with literal \n.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not look like a .p8 file. \
          Paste the file contents verbatim, including the BEGIN/END lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Manual signing is used only when a distribution certificate is supplied;
      # otherwise the build uses Xcode cloud signing driven by the API key.
      - name: Detect signing mode
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "SIGNING_MODE=manual" >> "$GITHUB_ENV"
            echo "Using manual signing with the supplied distribution certificate."
          else
            echo "SIGNING_MODE=automatic" >> "$GITHUB_ENV"
            echo "Using Xcode cloud signing via the App Store Connect API key."
          fi

      - name: Import signing certificate and profile
        if: env.SIGNING_MODE == 'manual'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if [ -n "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_DIR"
            echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
              -o "$PROFILES_DIR/build.mobileprovision"
          fi

      # --------------------------------------------------------------- verify
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${SIM_DEFAULT}" \
            -derivedDataPath build/DerivedData \
            -only-testing:PeriodicProTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # --------------------------------------------------------- build number
      - name: Resolve version and build number
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_IDENTIFIER }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail
          MARKETING_VERSION=$(sed -n 's/^MARKETING_VERSION = //p' Config/Shared.xcconfig | tr -d '[:space:]')
          OFFSET="${BUILD_NUMBER_OFFSET:-0}"
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RESOLVED_BUNDLE_ID=${BUNDLE_ID:-}" >> "$GITHUB_ENV"
          echo "Building $MARKETING_VERSION ($BUILD_NUMBER)"

      # -------------------------------------------------------------- archive
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARGS=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE_PATH"
            -derivedDataPath build/DerivedData
            DEVELOPMENT_TEAM="$TEAM_ID"
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          )
          if [ -n "${RESOLVED_BUNDLE_ID:-}" ]; then
            ARGS+=(PRODUCT_BUNDLE_IDENTIFIER_BASE="$RESOLVED_BUNDLE_ID")
          fi
          if [ "$SIGNING_MODE" = "automatic" ]; then
            ARGS+=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$ASC_KEY_PATH"
              -authenticationKeyID "$KEY_ID"
              -authenticationKeyIssuerID "$ISSUER_ID"
              CODE_SIGN_STYLE=Automatic
            )
          else
            ARGS+=(CODE_SIGN_STYLE=Manual)
          fi

          xcodebuild archive "${ARGS[@]}" | xcbeautify --renderer github-actions

      # What Apple will actually receive, read back out of the archive rather
      # than assumed from the build settings that were meant to produce it.
      # Each of these has its own way of going wrong quietly: a device family
      # that never picked up the iPad, a display name still reading the target
      # name, and an export-compliance key written as the string "NO" rather
      # than a boolean — which App Store Connect ignores, leaving the build
      # sitting in Missing Compliance until somebody answers the question by
      # hand.
      - name: Verify what was archived
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$APP" ] || { echo "::error::The archive contains no .app"; exit 1; }
          PLIST="$APP/Info.plist"

          BUNDLE_ID_BUILT=$(plutil -extract CFBundleIdentifier raw "$PLIST")
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw "$PLIST")
          VERSION_BUILT=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          BUILD_BUILT=$(plutil -extract CFBundleVersion raw "$PLIST")
          FAMILIES=$(plutil -extract UIDeviceFamily json -o - "$PLIST")
          ENCRYPTION=$(plutil -extract ITSAppUsesNonExemptEncryption json -o - "$PLIST" 2>/dev/null || echo missing)

          echo "bundle identifier: $BUNDLE_ID_BUILT"
          echo "display name:      $DISPLAY_NAME"
          echo "version:           $VERSION_BUILT ($BUILD_BUILT)"
          echo "device families:   $FAMILIES"
          echo "non-exempt crypto: $ENCRYPTION"
          echo "app icon:          $(ls "$APP" | grep -c '^AppIcon') file(s)"

          fail=0
          case "$FAMILIES" in
            *2*) ;;
            *) echo "::error::The archive is iPhone-only. TARGETED_DEVICE_FAMILY \
          should be 1,2 in Config/Shared.xcconfig."; fail=1 ;;
          esac
          [ "$DISPLAY_NAME" = "Elemora" ] || {
            echo "::error::The Home Screen name is '$DISPLAY_NAME', not Elemora"; fail=1; }
          [ "$ENCRYPTION" = "false" ] || {
            echo "::error::ITSAppUsesNonExemptEncryption is $ENCRYPTION, and App Store \
          Connect reads only a real boolean. The build would land in Missing Compliance."
            fail=1; }
          [ "$BUILD_BUILT" = "$BUILD_NUMBER" ] || {
            echo "::error::Built build number $BUILD_BUILT does not match the resolved \
          $BUILD_NUMBER, so the upload would collide with an earlier build."; fail=1; }
          [ "$fail" -eq 0 ]

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          SIGNING_STYLE=automatic
          if [ "$SIGNING_MODE" = "manual" ]; then SIGNING_STYLE=manual; fi
          # Built line by line rather than with a heredoc: a plist whose XML
          # declaration is preceded by whitespace is rejected by xcodebuild.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>destination</key><string>export</string>'
            echo "  <key>teamID</key><string>${TEAM_ID}</string>"
            echo "  <key>signingStyle</key><string>${SIGNING_STYLE}</string>"
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>manageAppVersionAndBuildNumber</key><false/>'
            echo '  <key>stripSwiftSymbols</key><true/>'
            echo '</dict>'
            echo '</plist>'
          } > build/ExportOptions.plist
          plutil -lint build/ExportOptions.plist
          cat build/ExportOptions.plist

      - name: Export signed IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions
          ls -la "$EXPORT_PATH"
          IPA_PATH=$(find "$EXPORT_PATH" -name '*.ipa' -maxdepth 1 | head -n 1)
          [ -n "$IPA_PATH" ] || { echo "::error::No .ipa was produced"; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      # --------------------------------------------------------------- upload
      - name: Validate with App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          echo "Uploaded $MARKETING_VERSION ($BUILD_NUMBER) to App Store Connect."

      # ---------------------------------------------------------------- after
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodicpro-${{ env.MARKETING_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            build/export/*.ipa
            build/PeriodicPro.xcarchive/dSYMs
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### TestFlight"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | ${MARKETING_VERSION:-unknown} |"
            echo "| Build | ${BUILD_NUMBER:-unknown} |"
            echo "| Signing | ${SIGNING_MODE:-unknown} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

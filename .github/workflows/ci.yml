name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: PeriodicPro
  PROJECT: PeriodicPro.xcodeproj
  # App Store Connect requires builds made with Xcode 26 or newer, so the whole
  # pipeline is pinned to that toolchain.
  XCODE_VERSION: "26.0"

jobs:
  validate-data:
    name: Validate data and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs the same structural checks the Swift unit tests run, but without
      # needing a Mac — so a bad dataset fails in seconds on every push.
      - name: Validate elements.json
        run: python3 Tools/validate_elements.py

      - name: Lint Swift sources
        run: python3 Tools/lint_sources.py

      - name: Validate Xcode project structure
        run: python3 Tools/validate_project.py

      - name: Check initializer call sites
        run: python3 Tools/check_initializers.py

      - name: Check color contrast
        run: python3 Tools/check_contrast.py

      - name: Check spelling is normalized
        run: |
          set -euo pipefail
          python3 Tools/normalize_spelling.py \
            PeriodicPro/Data/elements.json \
            $(find PeriodicPro PeriodicProTests PeriodicProUITests -name '*.swift') \
            ./*.md
          if ! git diff --quiet; then
            echo "::error::Sources contain British spellings. Run Tools/verify.sh and commit."
            git --no-pager diff --stat
            exit 1
          fi

  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Available Xcode versions:"
          ls /Applications | grep -i '^Xcode' || true
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "::warning::Xcode ${XCODE_VERSION} not found on this runner; using the default toolchain."
          fi
          xcodebuild -version
          swift --version

      - name: Ensure xcbeautify is available
        run: which xcbeautify || brew install xcbeautify

      - name: Show destinations
        run: xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations || true

      - name: Resolve simulators
        run: |
          set -euo pipefail
          # GitHub rotates the device set in its macOS images, so the
          # destinations are resolved from what the machine actually has rather
          # than hard-coded by name.
          xcrun simctl list devices available --json \
            | python3 Tools/pick_simulators.py >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: |
          # The app ships with no third-party packages; this keeps the step
          # honest if one is ever added.
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${SIM_DEFAULT}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${SIM_DEFAULT}" \
            -derivedDataPath build/DerivedData \
            -only-testing:PeriodicProTests \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${SIM_DEFAULT}" \
            -derivedDataPath build/DerivedData \
            -only-testing:PeriodicProUITests \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build Release (unsigned) to catch optimiser-only failures
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

  smaller-and-larger-phones:
    name: Layout check (${{ matrix.size }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        size: [SIM_SMALL, SIM_LARGE]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version

      - name: Ensure xcbeautify is available
        run: which xcbeautify || brew install xcbeautify

      - name: Resolve simulators
        run: |
          set -euo pipefail
          # GitHub rotates the device set in its macOS images, so the
          # destinations are resolved from what the machine actually has rather
          # than hard-coded by name.
          xcrun simctl list devices available --json \
            | python3 Tools/pick_simulators.py >> "$GITHUB_ENV"

      - name: Launch-and-layout UI tests
        run: |
          set -euo pipefail
          set -o pipefail
          KEY="${{ matrix.size }}"
          UDID="${!KEY}"
          NAME_KEY="${KEY}_NAME"
          echo "Running on ${!NAME_KEY} ($UDID)"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PeriodicProUITests/PeriodicProLaunchTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
